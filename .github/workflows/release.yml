name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Windows (x86_64)'
        required: true
        default: true
        type: boolean
      linux:
        description: 'Linux (x86_64)'
        required: true
        default: true
        type: boolean
      macos_x64:
        description: 'macOS (x86_64 / Intel)'
        required: true
        default: false
        type: boolean
      macos_arm64:
        description: 'macOS (ARM64 / Apple Silicon)'
        required: true
        default: false
        type: boolean
      android:
        description: 'Android'
        required: true
        default: false
        type: boolean
      iOS:
        description: 'iOS'
        required: true
        default: false
        type: boolean
      tag_name:
        description: 'Release tag name (leave empty to auto-generate from commit hash)'
        required: false
        default: ''
        type: string
      tag_prefix:
        description: 'Auto-generated tag prefix (default: "release-", use "devbuild-" for dev builds)'
        required: false
        default: 'release-'
        type: string
      name_prefix:
        description: 'Auto-generated release name prefix (default: "Release ")'
        required: false
        default: 'Release '
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

env:
  PROJECT_NAME: KathyEngine
  HAXE_VERSION: 4.3.7

jobs:
  commit-info:
    uses: ./.github/workflows/commit-info.yml

  build-windows:
    name: Windows
    needs: commit-info
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.windows }}
    with:
      name: Windows
      os: windows-2022
      setupCommand: .\setup\windows.bat
      buildArgs: "windows -final -D officialBuild"
      artifactName: windowsBuild-x86_64
      artifactPath: export\release\windows\bin\*

  build-linux:
    name: Linux
    needs: commit-info
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.linux }}
    with:
      name: Linux
      os: ubuntu-24.04
      setupCommand: sh ./setup/unix.sh
      buildArgs: "linux -final -D officialBuild"
      artifactName: linuxBuild-x86_64
      artifactPath: export/release/linux/bin/*

  build-macos-x64:
    name: macOS x86_64
    needs: commit-info
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.macos_x64 }}
    with:
      name: macOS x86_64
      os: macos-15
      setupCommand: sh ./setup/unix.sh
      buildArgs: "mac -64 -D HXCPP_M64 -final -D officialBuild"
      artifactName: macOSBuild-x86_64
      artifactPath: export/release/macos/bin/*

  build-macos-arm64:
    name: macOS ARM64
    needs: commit-info
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.macos_arm64 }}
    with:
      name: macOS ARM64
      os: macos-15
      setupCommand: sh ./setup/unix.sh
      buildArgs: "mac -arm64 -D HXCPP_ARM64 -final -D officialBuild"
      artifactName: macOSBuild-arm64
      artifactPath: export/release/macos/bin/*

  build-android:
    name: Android
    needs: commit-info
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.android }}
    # Android 完全可以跑在 ubuntu 上，比 macos 便宜 10x
    with:
      name: Android
      os: ubuntu-24.04
      setupCommand: sh ./setup/unix.sh
      buildArgs: "android -final -D officialBuild"
      artifactName: androidBuild
      artifactPath: export/release/android/bin/app/build/outputs/apk/release/*.apk

  build-ios:
    name: iOS
    needs: commit-info
    uses: ./.github/workflows/build.yml
    if: ${{ inputs.iOS }}
    with:
      name: iOS
      os: macos-15
      setupCommand: sh ./setup/unix.sh
      buildArgs: "ios -final -nosign -D officialBuild"
      artifactName: iOSBuild
      artifactPath: export/release/ios/build/Release-iphoneos/*.ipa

  release:
    name: Release
    needs: [commit-info, build-windows, build-linux, build-macos-x64, build-macos-arm64, build-android, build-ios]
    # 至少勾选了一个平台，且至少有一个构建成功才继续
    if: ${{ !cancelled() && (inputs.windows || inputs.linux || inputs.macos_x64 || inputs.macos_arm64 || inputs.android || inputs.iOS) && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-macos-x64.result == 'success' || needs.build-macos-arm64.result == 'success' || needs.build-android.result == 'success' || needs.build-ios.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Windows
        if: ${{ inputs.windows }}
        uses: actions/download-artifact@v4
        with:
          name: windowsBuild-x86_64
          path: builds/windows

      - name: Download Linux
        if: ${{ inputs.linux }}
        uses: actions/download-artifact@v4
        with:
          name: linuxBuild-x86_64
          path: builds/linux

      - name: Download macOS x64
        if: ${{ inputs.macos_x64 }}
        uses: actions/download-artifact@v4
        with:
          name: macOSBuild-x86_64
          path: builds/macos-x64

      - name: Download macOS arm64
        if: ${{ inputs.macos_arm64 }}
        uses: actions/download-artifact@v4
        with:
          name: macOSBuild-arm64
          path: builds/macos-arm64

      - name: Download Android
        if: ${{ inputs.android }}
        uses: actions/download-artifact@v4
        with:
          name: androidBuild
          path: builds/android

      - name: Download iOS
        if: ${{ inputs.iOS }}
        uses: actions/download-artifact@v4
        with:
          name: iOSBuild
          path: builds/ios

      - name: Compress & Prepare
        run: |
          # runner 自带 7z，无需 apt install
          if [ -d builds/windows ]; then cd builds/windows && 7z a -tzip ../../${{ env.PROJECT_NAME }}-windows.zip ./* && cd ../..; fi
          if [ -d builds/linux ]; then cd builds/linux && 7z a -tzip ../../${{ env.PROJECT_NAME }}-linux.zip ./* && cd ../..; fi
          if [ -d builds/macos-x64 ]; then cd builds/macos-x64 && 7z a -tzip ../../${{ env.PROJECT_NAME }}-macos-x64.zip ./* && cd ../..; fi
          if [ -d builds/macos-arm64 ]; then cd builds/macos-arm64 && 7z a -tzip ../../${{ env.PROJECT_NAME }}-macos-arm64.zip ./* && cd ../..; fi
          if [ -d builds/android ]; then cp builds/android/*.apk ./${{ env.PROJECT_NAME }}-android.apk; fi
          if [ -d builds/ios ]; then cp builds/ios/*.ipa ./${{ env.PROJECT_NAME }}-ios.ipa; fi

      - name: Build file list & Release Info
        id: release_info
        run: |
          # 动态构建文件列表——比在 YAML 里写一堆空行条件表达式更可靠
          files=""
          [ -f "${{ env.PROJECT_NAME }}-windows.zip" ] && files+="${{ env.PROJECT_NAME }}-windows.zip"$'\n'
          [ -f "${{ env.PROJECT_NAME }}-linux.zip" ] && files+="${{ env.PROJECT_NAME }}-linux.zip"$'\n'
          [ -f "${{ env.PROJECT_NAME }}-macos-x64.zip" ] && files+="${{ env.PROJECT_NAME }}-macos-x64.zip"$'\n'
          [ -f "${{ env.PROJECT_NAME }}-macos-arm64.zip" ] && files+="${{ env.PROJECT_NAME }}-macos-arm64.zip"$'\n'
          [ -f "${{ env.PROJECT_NAME }}-android.apk" ] && files+="${{ env.PROJECT_NAME }}-android.apk"$'\n'
          [ -f "${{ env.PROJECT_NAME }}-ios.ipa" ] && files+="${{ env.PROJECT_NAME }}-ios.ipa"$'\n'

          if [ -n "${{ inputs.tag_name }}" ]; then
            tag="${{ inputs.tag_name }}"
            name="${{ inputs.tag_name }}"
          else
            tag="${{ inputs.tag_prefix }}${{ needs.commit-info.outputs.commit_hash }}"
            name="${{ inputs.name_prefix }}${{ needs.commit-info.outputs.commit_hash }}"
          fi

          # 用 heredoc 把多行 files 写进 GITHUB_OUTPUT
          {
            echo "files<<EOF"
            printf '%s' "$files"
            echo "EOF"
            echo "tag=$tag"
            echo "name=$name"
          } >> $GITHUB_OUTPUT

          echo "--- Release Info ---"
          echo "tag: $tag"
          echo "name: $name"
          echo "files:"
          printf '%s' "$files"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_info.outputs.name }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.release_info.outputs.files }}
